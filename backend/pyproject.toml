[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E402", "B008", "B904", "I001"]

[tool.ruff.lint.per-file-ignores]
# Allow long lines in tests — they often have long fixture URLs and assertion messages
"tests/**" = ["E501"]
# Allow long lines in alembic migrations — SQL column definitions are frequently wide
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
