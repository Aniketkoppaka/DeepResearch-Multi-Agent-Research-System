name: DeepResearch Cloud Ci & Runtime Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepresearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports:
          - 6333:6333


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Backend Quality Gates (Ruff & Mypy)
        working-directory: ./backend
        run: |
          python -m ruff check .
          python -m mypy app --no-incremental

      - name: Live PostgreSQL Alembic Migration Verification
        working-directory: ./backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepresearch
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run Backend Pytest Suite (with Live Postgres & Redis)
        working-directory: ./backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepresearch
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          ENVIRONMENT: test
        run: |
          python -m pytest -v



      - name: Frontend Quality Gates (ESLint, TypeScript, Vitest)
        working-directory: ./frontend
        run: |
          npx eslint "src/**/*.ts" "src/**/*.tsx"
          npx tsc --noEmit
          npx vitest run

      - name: Test Frontend Production Build
        working-directory: ./frontend
        run: |
          npm run build